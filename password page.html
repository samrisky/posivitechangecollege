<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#eef2f7;
    margin:0;
    padding:30px;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h1{
    color:#1f4f82;
}

.users-box{
    max-width:1000px;
    margin:auto;
}

.user-card{
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.user-card h2{
    color:#1f4f82;
    margin-bottom:15px;
}

.user-card p{
    margin:10px 0;
    color:#333;
}

.role{
    display:inline-block;
    padding:8px 15px;
    border-radius:30px;
    background:#1f4f82;
    color:white;
    font-size:14px;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="title"> 
    <h1>School Admin Dashboard</h1>
    <p>Registered Parents & Students</p>
</div>

<div class="users-box" id="usersContainer">

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDmvmqTgjhbtgLxrbvgmT3LQgEsNoj3x_g",
  authDomain: "positivechangecollege-4d2cb.firebaseapp.com",
  projectId: "positivechangecollege-4d2cb",
  storageBucket: "positivechangecollege-4d2cb.firebasestorage.app",
  messagingSenderId: "847572892577",
  appId: "1:847572892577:web:1f6184c056ca46cf3ce9e0",
  measurementId: "G-CVGTLPDR5M"
};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const usersContainer = document.getElementById("usersContainer");



// =====================
// LOAD PARENTS
// =====================

async function loadParents(){

  const querySnapshot = await getDocs(
    collection(db, "parents")
  );

  querySnapshot.forEach((doc)=>{

    const data = doc.data();

    usersContainer.innerHTML += `

      <div class="user-card">

        <h2>${data.name}</h2>

        <p><strong>Email:</strong> ${data.email}</p>

        <p><strong>Role:</strong> Parent</p>

        <div class="role">
          Parent
        </div>

      </div>

    `;

  });

}



// =====================
// LOAD STUDENTS
// =====================

async function loadStudents(){

  const querySnapshot = await getDocs(
    collection(db, "students")
  );

  querySnapshot.forEach((doc)=>{

    const data = doc.data();

    usersContainer.innerHTML += `

      <div class="user-card">

        <h2>${data.name}</h2>

        <p><strong>Email:</strong> ${data.email}</p>

        <p><strong>Role:</strong> Student</p>

        <div class="role">
          Student
        </div>

      </div>

    `;

  });

}



// RUN FUNCTIONS

loadParents();

loadStudents();

</script>

</body>
</html>
