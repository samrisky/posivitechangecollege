<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Past Questions · Positive Change College</title>
    <style>
        /* ---------- Reset & Base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            background: radial-gradient(circle at 10% 20%, rgba(10, 25, 47, 0.98), rgba(2, 12, 27, 1));
            color: #e0e0e0;
            line-height: 1.5;
        }

        .page-wrapper {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 2rem;
            border: 1px solid rgba(0, 255, 195, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            padding: 2.5rem 2rem 3rem;
            transition: all 0.2s;
        }

        /* ---------- Header ---------- */
        .page-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid rgba(0, 255, 195, 0.15);
            margin-bottom: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: #00ffc3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0a192f;
            font-size: 1.4rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .brand-name span {
            color: #00ffc3;
        }

        .page-title-badge {
            background: rgba(0, 255, 195, 0.12);
            padding: 0.5rem 1.4rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #00ffc3;
            border: 1px solid rgba(0, 255, 195, 0.25);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .page-title-badge .count {
            background: #00ffc3;
            color: #0a192f;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
        }

        /* ---------- Filter Bar ---------- */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 1.5rem;
            padding: 1.25rem 0 1.75rem 0;
            border-bottom: 1px solid rgba(0, 255, 195, 0.1);
            margin-bottom: 2rem;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            flex: 1 0 160px;
            min-width: 140px;
        }

        .filter-group label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.5);
        }

        .filter-group select {
            padding: 0.6rem 0.9rem;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 0.85rem;
            background: rgba(2, 12, 27, 0.6);
            color: #e0e0e0;
            transition: border 0.15s, box-shadow 0.15s;
            font-family: inherit;
            width: 100%;
            appearance: auto;
            cursor: pointer;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #00ffc3;
            box-shadow: 0 0 0 3px rgba(0, 255, 195, 0.15);
        }

        .filter-group select option {
            background: #0a192f;
            color: #e0e0e0;
        }

        .filter-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            align-items: center;
            padding-bottom: 0.1rem;
        }

        .btn {
            padding: 0.6rem 1.4rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-primary {
            background: #00ffc3;
            color: #0a192f;
        }

        .btn-primary:hover {
            background: #66ffd9;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 255, 195, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-sm {
            padding: 0.3rem 0.9rem;
            font-size: 0.75rem;
            border-radius: 8px;
        }

        .btn-download {
            background: rgba(0, 255, 195, 0.15);
            color: #00ffc3;
            border: 1px solid rgba(0, 255, 195, 0.2);
        }
        .btn-download:hover {
            background: rgba(0, 255, 195, 0.25);
        }

        .btn-preview {
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-preview:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ---------- Results Summary ---------- */
        .results-summary {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .results-summary .found {
            font-weight: 600;
        }

        .results-summary .found span {
            color: #00ffc3;
            font-size: 1.1rem;
        }

        .results-summary .loading-text {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #00ffc3;
            font-weight: 500;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(0, 255, 195, 0.2);
            border-top-color: #00ffc3;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- Questions Grid ---------- */
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            min-height: 200px;
        }

        .question-card {
            background: rgba(2, 12, 27, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.25rem;
            padding: 1.25rem 1.5rem 1.5rem;
            transition: all 0.25s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .question-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 255, 195, 0.3);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .question-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.6rem;
        }

        .question-card .course-code {
            font-weight: 700;
            font-size: 0.85rem;
            color: #0a192f;
            background: #00ffc3;
            padding: 0.2rem 0.8rem;
            border-radius: 100px;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .question-card .semester-badge {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 0.15rem 0.7rem;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .question-card .semester-badge.fall {
            background: rgba(0, 255, 195, 0.1);
            color: #00ffc3;
            border-color: rgba(0, 255, 195, 0.15);
        }

        .question-card .semester-badge.spring {
            background: rgba(0, 255, 195, 0.05);
            color: #66ffd9;
            border-color: rgba(0, 255, 195, 0.1);
        }

        .question-card .semester-badge.summer {
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .question-card .course-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.2rem;
            line-height: 1.3;
        }

        .question-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.2rem;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.4);
            margin: 0.4rem 0 0.8rem 0;
        }

        .question-card .meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .question-card .meta .label {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.2);
        }

        .question-card .card-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: auto;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
        }

        .question-card .card-actions .btn {
            flex: 1;
            justify-content: center;
            min-width: 80px;
        }

        /* ---------- Empty State ---------- */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3.5rem 1.5rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 0.3rem;
        }

        .empty-state p {
            font-size: 0.9rem;
            max-width: 400px;
            margin: 0 auto;
        }

        /* ---------- Modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 12, 27, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1.5rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: radial-gradient(circle at 10% 20%, rgba(10, 25, 47, 0.98), rgba(2, 12, 27, 1));
            max-width: 820px;
            width: 100%;
            max-height: 90vh;
            border-radius: 1.75rem;
            border: 1px solid rgba(0, 255, 195, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            transform: scale(0.95) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1.75rem 2rem 0.5rem 2rem;
            border-bottom: 2px solid rgba(0, 255, 195, 0.1);
            flex-shrink: 0;
        }

        .modal-header .modal-title-group {
            flex: 1;
            padding-right: 1rem;
        }

        .modal-header .modal-title-group h2 {
            font-size: 1.3rem;
            color: #ffffff;
            line-height: 1.3;
        }

        .modal-header .modal-title-group .modal-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.2rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 0.2rem;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-body {
            padding: 1.75rem 2rem 2rem 2rem;
            overflow-y: auto;
            flex: 1;
            font-size: 0.95rem;
            color: #e0e0e0;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .modal-body .paper-instruction {
            font-weight: 600;
            color: #00ffc3;
            margin-bottom: 1rem;
            border-left: 4px solid #00ffc3;
            padding-left: 1rem;
            background: rgba(0, 255, 195, 0.05);
            border-radius: 0 8px 8px 0;
            padding: 0.75rem 1rem;
        }

        /* ---------- Footer ---------- */
        .page-footer {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid rgba(0, 255, 195, 0.05);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .page-footer .footer-note {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .page-footer .footer-note span {
            background: rgba(255, 255, 255, 0.03);
            padding: 0.2rem 0.9rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(2, 12, 27, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #00ffc3;
            padding: 0.8rem 1.6rem;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            border: 1px solid rgba(0, 255, 195, 0.15);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 2000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 768px) {
            body {
                padding: 1rem 0.75rem;
            }
            .page-wrapper {
                padding: 1.25rem 0.75rem 1.75rem;
                border-radius: 1.25rem;
            }
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
            .brand-name {
                font-size: 1.4rem;
            }
            .page-title-badge {
                font-size: 0.8rem;
                padding: 0.3rem 1rem;
            }
            .filter-bar {
                flex-direction: column;
                gap: 0.8rem;
            }
            .filter-group {
                flex: 1 1 auto;
                min-width: 100%;
            }
            .filter-actions {
                width: 100%;
            }
            .filter-actions .btn {
                flex: 1;
                justify-content: center;
            }
            .questions-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .modal-box {
                max-height: 95vh;
            }
            .modal-header {
                padding: 1.25rem 1.25rem 0.25rem 1.25rem;
            }
            .modal-body {
                padding: 1.25rem;
            }
            .page-footer {
                flex-direction: column;
                gap: 0.75rem;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .page-wrapper {
                padding: 0.75rem 0.4rem 1.25rem;
            }
            .question-card {
                padding: 1rem 1rem 1.25rem;
            }
            .question-card .card-actions .btn {
                font-size: 0.7rem;
                padding: 0.4rem 0.5rem;
            }
            .modal-box {
                border-radius: 1.25rem;
            }
            .toast {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
                text-align: center;
                font-size: 0.8rem;
                padding: 0.7rem 1.2rem;
            }
        }

        /* ---------- Print ---------- */
        @media print {
            .modal-overlay {
                display: none;
            }
            body {
                background: #fff !important;
                padding: 0.3in;
            }
            .page-wrapper {
                background: #fff !important;
                backdrop-filter: none !important;
                box-shadow: none !important;
                border: 1px solid #ccc !important;
                border-radius: 0 !important;
                padding: 1rem !important;
            }
            .filter-bar {
                display: none !important;
            }
            .btn {
                display: none !important;
            }
            .question-card .card-actions {
                display: none !important;
            }
            .brand-name {
                color: #000 !important;
            }
            .question-card .course-title {
                color: #000 !important;
            }
            .question-card {
                background: #fff !important;
                border: 1px solid #ccc !important;
            }
            .page-title-badge {
                color: #000 !important;
                border-color: #ccc !important;
            }
            .page-title-badge .count {
                color: #fff !important;
                background: #000 !important;
            }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">

        <!-- ===== HEADER ===== -->
        <header class="page-header">
            <div class="brand">
                <div class="brand-icon">+</div>
                <div class="brand-name">Positive <span>Change</span> College</div>
            </div>
            <div class="page-title-badge">
                📚 Past Questions
                <span class="count" id="resultCount">0</span>
            </div>
        </header>

        <!-- ===== FILTER BAR ===== -->
        <div class="filter-bar" id="filterBar">
            <div class="filter-group">
                <label for="courseFilter">Course</label>
                <select id="courseFilter">
                    <option value="all">All Courses</option>
                    <option value="CSC">Computer Science</option>
                    <option value="MTH">Mathematics</option>
                    <option value="PHY">Physics</option>
                    <option value="CHE">Chemistry</option>
                    <option value="BIO">Biology</option>
                    <option value="ENG">Engineering</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="yearFilter">Year</label>
                <select id="yearFilter">
                    <option value="all">All Years</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="semesterFilter">Semester</label>
                <select id="semesterFilter">
                    <option value="all">All Semesters</option>
                    <option value="Fall">Fall</option>
                    <option value="Spring">Spring</option>
                    <option value="Summer">Summer</option>
                </select>
            </div>

            <div class="filter-group" style="flex: 0 1 auto; min-width: 120px;">
                <label>&nbsp;</label>
                <div class="filter-actions">
                    <button class="btn btn-primary" id="applyFilters">🔍 Apply</button>
                    <button class="btn btn-secondary" id="resetFilters">Reset</button>
                </div>
            </div>
        </div>

        <!-- ===== RESULTS SUMMARY ===== -->
        <div class="results-summary" id="resultsSummary">
            <div class="found">Showing <span id="foundCount">0</span> past questions</div>
            <div id="loadingIndicator" style="display: none;" class="loading-text">
                <span class="spinner"></span> Loading...
            </div>
        </div>

        <!-- ===== QUESTIONS GRID ===== -->
        <div class="questions-grid" id="questionsGrid">
            <!-- Cards rendered by JS -->
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="page-footer">
            <div class="footer-note">
                <span>📄 All papers for practice purposes</span>
                <span>🔄 Updated regularly</span>
            </div>
            <div style="font-size:0.8rem; color: rgba(255,255,255,0.2);">
                Positive Change College &bull; Academic Resource
            </div>
        </footer>

    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="questionModal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title-group">
                    <h2 id="modalTitle">Course Title</h2>
                    <div class="modal-meta" id="modalMeta">
                        <span><span class="label">Code:</span> <span id="modalCode">CSC101</span></span>
                        <span><span class="label">Semester:</span> <span id="modalSemester">Fall 2024</span></span>
                        <span><span class="label">Exam:</span> <span id="modalExam">Final</span></span>
                    </div>
                </div>
                <button class="modal-close" id="modalCloseBtn" aria-label="Close modal">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Paper content rendered here -->
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  SIMPLIFIED DATA — just a few sample papers
        // ============================================================

        const QUESTION_BANK = [{
            id: 1,
            courseCode: 'CSC101',
            courseTitle: 'Introduction to Computer Science',
            semester: 'Fall',
            year: 2024,
            examType: 'Final',
            description: 'Fundamentals of programming, algorithms, and data structures.',
            paperContent: `📜 CSC101 – Introduction to Computer Science
        Semester: Fall 2024  |  Exam: Final
        Time: 2.5 hours  |  Total Marks: 100

        INSTRUCTIONS:
        • Section A is compulsory (40 marks).
        • Answer any TWO questions from Section B (30 marks each).
        • Show all workings clearly.

        ═══════════════════════════════════════════
        SECTION A (Compulsory – 40 marks)
        ═══════════════════════════════════════════

        1. (a) Define an algorithm and explain its key characteristics. (5 marks)
           (b) Write an algorithm to find the largest of three numbers. (10 marks)

        2. (a) Differentiate between a compiler and an interpreter. (7 marks)
           (b) Explain the concept of a variable and data types in programming. (8 marks)

        3. (a) What is the difference between a for loop and a while loop? (4 marks)
           (b) Convert the binary number 1101 to decimal. (3 marks)
           (c) Convert the decimal number 42 to binary. (3 marks)

        ═══════════════════════════════════════════

        // ============================================================
        //  SIMPLIFIED API (Filtering logic)
        // ============================================================

        function fetchPastQuestions(filters = {}) {
            return new Promise((resolve) => {
                // Simulate network delay (short)
                setTimeout(() => {
                    let results = [...QUESTION_BANK];

                    if (filters.course && filters.course !== 'all') {
                        results = results.filter(q => q.courseCode.startsWith(filters.course));
                    }
                    if (filters.year && filters.year !== 'all') {
                        results = results.filter(q => q.year === parseInt(filters.year, 10));
                    }
                    if (filters.semester && filters.semester !== 'all') {
                        results = results.filter(q => q.semester === filters.semester);
                    }

                    resolve(results);
                }, 300);
            });
        }

        // ============================================================
        //  UI CONTROLLER
        // ============================================================

        const grid = document.getElementById('questionsGrid');
        const foundCount = document.getElementById('foundCount');
        const resultCountBadge = document.getElementById('resultCount');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const toast = document.getElementById('toast');

        const modalOverlay = document.getElementById('questionModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalCode = document.getElementById('modalCode');
        const modalSemester = document.getElementById('modalSemester');
        const modalExam = document.getElementById('modalExam');
        const modalBody = document.getElementById('modalBody');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        let toastTimeout = null;

        function showToast(message, duration = 2500) {
            toast.textContent = message;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ---------- Modal ----------
        function openModal(question) {
            modalTitle.textContent = `${question.courseCode} – ${question.courseTitle}`;
            modalCode.textContent = question.courseCode;
            modalSemester.textContent = `${question.semester} ${question.year}`;
            modalExam.textContent = question.examType;

            modalBody.innerHTML = question.paperContent.replace(/\n/g, '<br>');

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalCloseBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ---------- Render ----------
        function renderQuestions(questions) {
            grid.innerHTML = '';

            if (questions.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <h3>No past questions found</h3>
                        <p>Try adjusting your filters or reset to see all available papers.</p>
                    </div>
                `;
                return;
            }

            questions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'question-card';

                const semesterClass = q.semester.toLowerCase();

                card.innerHTML = `
                    <div class="card-top">
                        <span class="course-code">${q.courseCode}</span>
                        <span class="semester-badge ${semesterClass}">${q.semester} ${q.year}</span>
                    </div>
                    <div class="course-title">${q.courseTitle}</div>
                    <div class="meta">
                        <span><span class="label">Exam:</span> ${q.examType}</span>
                        <span><span class="label">Year:</span> ${q.year}</span>
                        <span><span class="label">Semester:</span> ${q.semester}</span>
                    </div>
                    <div style="font-size:0.82rem; color: rgba(255,255,255,0.5); margin-bottom:0.6rem; line-height:1.4;">
                        ${q.description}
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-download btn-sm" data-id="${q.id}" data-action="download">⬇ Download</button>
                        <button class="btn btn-preview btn-sm" data-id="${q.id}" data-action="preview">👁 Preview</button>
                    </div>
                `;

                grid.appendChild(card);
            });

            grid.querySelectorAll('[data-action="download"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.dataset.id, 10);
                    const q = questions.find(item => item.id === id);
                    if (q) {
                        showToast(`⬇ Downloading ${q.courseCode} – ${q.courseTitle}`);
                    }
                });
            });

            grid.querySelectorAll('[data-action="preview"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.dataset.id, 10);
                    const q = questions.find(item => item.id === id);
                    if (q) {
                        openModal(q);
                    }
                });
            });
        }

        // ---------- Load ----------
        async function loadQuestions(filters = {}) {
            loadingIndicator.style.display = 'flex';
            grid.innerHTML = `
                <div class="empty-state" style="padding:2rem;">
                    <div class="spinner" style="width:32px;height:32px;border-width:3px;margin:0 auto 1rem;"></div>
                    <p style="color:#00ffc3;">Loading past questions...</p>
                </div>
            `;

            try {
                const results = await fetchPastQuestions(filters);
                renderQuestions(results);
                foundCount.textContent = results.length;
                resultCountBadge.textContent = results.length;
            } catch (err) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <h3>Something went wrong</h3>
                        <p>Please try refreshing or applying your filters again.</p>
                    </div>
                `;
                foundCount.textContent = '0';
                resultCountBadge.textContent = '0';
                showToast('⚠️ Failed to load past questions.', 3000);
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        // ============================================================
        //  FILTER HANDLING
        // ============================================================

        const courseFilter = document.getElementById('courseFilter');
        const yearFilter = document.getElementById('yearFilter');
        const semesterFilter = document.getElementById('semesterFilter');
        const applyBtn = document.getElementById('applyFilters');
        const resetBtn = document.getElementById('resetFilters');

        function getFilters() {
            return {
                course: courseFilter.value,
                year: yearFilter.value,
                semester: semesterFilter.value,
            };
        }

        function applyFilters() {
            loadQuestions(getFilters());
        }

        function resetFilters() {
            courseFilter.value = 'all';
            yearFilter.value = 'all';
            semesterFilter.value = 'all';
            applyFilters();
            showToast('🔄 Filters reset to show all past questions', 2000);
        }

        applyBtn.addEventListener('click', applyFilters);
        resetBtn.addEventListener('click', resetFilters);

        document.querySelectorAll('.filter-group select').forEach(el => {
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') applyFilters();
            });
        });

        // ============================================================
        //  INIT
        // ============================================================

        loadQuestions({ course: 'all', year: 'all', semester: 'all' });

        window.addEventListener('load', () => {
            setTimeout(() => {
                showToast('📚 Click "Preview" to view the full exam paper online', 3000);
            }, 600);
        });
    </script>
