<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Sign Up</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a192f;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  width:350px;
  background:#112240;
  padding:30px;
  border-radius:15px;
  border:1px solid #233554;
}

h2{
  text-align:center;
  color:#00ffc3;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  outline:none;
}

button{
  width:100%;
  margin-top:20px;
  padding:12px;
  background:#00ffc3;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#00d6a6;
}

.msg{
  color:white;
  text-align:center;
  margin-top:10px;
}

a{
  color:#38bdf8;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

  <h2>Create Parent Account</h2>

  <form id="signupForm">

    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>

    <button type="submit">Create Account</button>

    <div class="msg" id="msg"></div>

  </form>

  <p style="text-align:center;color:white;margin-top:15px;">
    Already have account? <a href="parent potalsignin.html">Sign In</a>
  </p>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

// Firebase config (yours is correct 👍)
const firebaseConfig = {
  apiKey: "AIzaSyDmvmqTgjhbtgLxrbvgmT3LQgEsNoj3x_g",
  authDomain: "positivechangecollege-4d2cb.firebaseapp.com",
  projectId: "positivechangecollege-4d2cb",
  storageBucket: "positivechangecollege-4d2cb.firebasestorage.app",
  messagingSenderId: "847572892577",
  appId: "1:847572892577:web:1f6184c056ca46cf3ce9e0",
  measurementId: "G-CVGTLPDR5M"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("signupForm");
const msg = document.getElementById("msg");

let loading = false;

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  if (loading) return;
  loading = true;

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    msg.innerText = "Creating account...";

    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    await setDoc(doc(db, "parents", user.uid), {
      name,
      email,
      role: "parent",
      createdAt: new Date()
    });

    msg.innerText = "Account created successfully ✔";

    setTimeout(() => {
      window.location.href = "parent potal signin.html";
    }, 1500);

  } catch (error) {
    msg.innerText = error.message;
  }

  loading = false;
});

</script>

</body>
</html>
