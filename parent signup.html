<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent Sign Up – Positive Change College</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at 10% 20%, rgba(10, 25, 47, 0.98), rgba(2, 12, 27, 1));
            background-attachment: fixed;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            padding: 44px 40px 40px;
            border-radius: 32px;
            border: 1px solid rgba(0, 255, 195, 0.12);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: border-color 0.3s;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .container:hover {
            border-color: rgba(0, 255, 195, 0.25);
        }
        .container::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -30%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 255, 195, 0.04), transparent 70%);
            pointer-events: none;
            z-index: -1;
            border-radius: 32px;
        }

        /* ── Logo ── */
        .logo-wrapper {
            margin-bottom: 12px;
        }
        .logo-wrapper img {
            width: 80px;
            height: auto;
            display: block;
            margin: 0 auto 8px;
            border: 2px solid rgba(0, 255, 195, 0.25);
            border-radius: 16px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.2);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .logo-wrapper img:hover {
            border-color: #00ffc3;
            box-shadow: 0 0 20px rgba(0, 255, 195, 0.15);
        }

        .container h1 {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .container h1 span {
            color: #00ffc3;
        }
        .container .subtitle {
            color: rgba(255, 255, 255, 0.45);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-box {
            margin-bottom: 18px;
            text-align: left;
        }
        .password-field {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 14px;
        }
        .input-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
        }
        .input-box input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            outline: none;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }
        .password-field input {
            padding-right: 46px;
        }
        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        .input-box input:focus {
            border-color: #00ffc3;
            background: rgba(0, 255, 195, 0.04);
            box-shadow: 0 0 0 4px rgba(0, 255, 195, 0.08);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: #00ffc3;
            color: #0b1a2e;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.25s;
            letter-spacing: 0.2px;
        }
        .btn-primary:hover {
            background: #66ffd6;
            transform: scale(1.01);
            box-shadow: 0 8px 30px rgba(0, 255, 195, 0.25);
        }

        .message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            min-height: 22px;
            color: #ffc857;
        }
        .message.success {
            color: #00ffc3;
        }
        .message.error {
            color: #ff6b6b;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }
        .bottom-text a {
            color: #00ffc3;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
            border-bottom: 1px solid transparent;
        }
        .bottom-text a:hover {
            color: #66ffd6;
            border-bottom-color: rgba(0, 255, 195, 0.3);
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 22px 30px;
            }
            .container h1 {
                font-size: 22px;
            }
            .logo-wrapper img {
                width: 60px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ─── LOGO ─── -->
    <div class="logo-wrapper">
        <img src="./pictures/pca logo.png" alt="Positive Change College Logo" />
    </div>

    <h1>Positive Change <span>College</span></h1>
    <p class="subtitle">Create Parent Account</p>

    <form id="signupForm">
        <div class="input-box">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter full name" required />
        </div>
        <div class="input-box">
            <label>Email</label>
            <input type="email" id="email" placeholder="parent@positive.edu" required />
        </div>
        <div class="input-box">
            <label>Password</label>
            <div class="password-field">
                <input type="password" id="password" placeholder="Create a password" required />
                <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-primary">Create Account</button>
        <div class="message" id="msg"></div>
    </form>

    <div class="bottom-text">
        Already have an account? <a href="parent potalsignin.html">Sign In</a>
    </div>
</div>

<script>
    document.querySelectorAll('.toggle-password').forEach((button) => {
        button.addEventListener('click', () => {
            const input = document.getElementById(button.dataset.target);
            if (!input) return;
            const icon = button.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });
    });
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmvmqTgjhbtgLxrbvgmT3LQgEsNoj3x_g",
        authDomain: "positivechangecollege-4d2cb.firebaseapp.com",
        projectId: "positivechangecollege-4d2cb",
        storageBucket: "positivechangecollege-4d2cb.firebasestorage.app",
        messagingSenderId: "847572892577",
        appId: "1:847572892577:web:1f6184c056ca46cf3ce9e0",
        measurementId: "G-CVGTLPDR5M"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("signupForm");
    const msg = document.getElementById("msg");
    let loading = false;

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (loading) return;
        loading = true;

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        msg.textContent = '';
        msg.className = 'message';

        if (!name || !email || !password) {
            msg.textContent = 'Please fill in all fields.';
            msg.className = 'message error';
            loading = false;
            return;
        }
        if (password.length < 6) {
            msg.textContent = 'Password must be at least 6 characters.';
            msg.className = 'message error';
            loading = false;
            return;
        }

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            await setDoc(doc(db, "parents", user.uid), {
                name,
                email,
                role: "parent",
                createdAt: new Date()
            });

            msg.textContent = 'Account created successfully! ✔';
            msg.className = 'message success';

            setTimeout(() => {
                window.location.href = "parent potalsignin.html";
            }, 1500);

        } catch (error) {
            console.error(error);
            let errMsg = error.message;
            if (error.code === 'auth/email-already-in-use') errMsg = 'This email is already registered.';
            else if (error.code === 'auth/invalid-email') errMsg = 'Please enter a valid email address.';
            else if (error.code === 'auth/weak-password') errMsg = 'Password is too weak. Use at least 6 characters.';
            msg.textContent = errMsg;
            msg.className = 'message error';
        }

        loading = false;
    });
</script>

</body>
</html>
