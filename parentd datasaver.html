<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registered Parents</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#0a192f;
  padding:30px;
  color:white;
}

.container{
  max-width:1100px;
  margin:auto;
}

h1{
  text-align:center;
  margin-bottom:25px;
  color:#00ffc3;
}

.table-container{
  overflow-x:auto;
  background:#112240;
  border-radius:15px;
  padding:20px;
  border:1px solid #233554;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#00ffc3;
  color:#0a192f;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-bottom:1px solid #233554;
}

tr:hover{
  background:#1b2b4a;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  background:red;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:0.8;
}

.no-data{
  text-align:center;
  padding:20px;
  color:#ccc;
}

</style>
</head>

<body>

<div class="container">

  <h1>Registered Parents</h1>

  <div class="table-container">

    <table>

      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>UID</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="parentTable">

        <tr>
          <td colspan="5" class="no-data">
            Loading parents...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDmvmqTgjhbtgLxrbvgmT3LQgEsNoj3x_g",
  authDomain: "positivechangecollege-4d2cb.firebaseapp.com",
  projectId: "positivechangecollege-4d2cb",
  storageBucket: "positivechangecollege-4d2cb.firebasestorage.app",
  messagingSenderId: "847572892577",
  appId: "1:847572892577:web:1f6184c056ca46cf3ce9e0",
  measurementId: "G-CVGTLPDR5M"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const table = document.getElementById("parentTable");

// LOAD PARENTS
async function loadParents(){

  try{

    const querySnapshot = await getDocs(collection(db, "parents"));

    if(querySnapshot.empty){

      table.innerHTML = `
        <tr>
          <td colspan="5" class="no-data">
            No parents registered yet
          </td>
        </tr>
      `;

      return;
    }

    table.innerHTML = "";

    querySnapshot.forEach((docSnap) => {

      const parent = docSnap.data();

      table.innerHTML += `
        <tr>
          <td>${parent.name || "No Name"}</td>
          <td>${parent.email || "No Email"}</td>
          <td>${parent.role || "parent"}</td>
          <td>${docSnap.id}</td>

          <td>
            <button onclick="deleteParent('${docSnap.id}')">
              Delete
            </button>
          </td>
        </tr>
      `;

    });

  }catch(error){

    table.innerHTML = `
      <tr>
        <td colspan="5" class="no-data">
          ${error.message}
        </td>
      </tr>
    `;

  }

}

// DELETE PARENT
window.deleteParent = async function(id){

  const confirmDelete = confirm("Delete this parent?");

  if(confirmDelete){

    try{

      await deleteDoc(doc(db, "parents", id));

      alert("Parent deleted successfully");

      loadParents();

    }catch(error){

      alert(error.message);
        
    }

  }

}

// LOAD
loadParents();

</script>

</body>
</html>
