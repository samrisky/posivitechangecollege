<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance | Positive Change College</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    :root {
      /* background exactly as requested */
      --bg: radial-gradient(circle at 10% 20%, rgba(10, 25, 47, 0.98), rgba(2, 12, 27, 1));
      /* card bg uses the teal with low opacity for a subtle glow */
      --card: rgba(0, 255, 195, 0.08);
      /* border with teal tint */
      --border: rgba(0, 255, 195, 0.20);
      /* accent color */
      --accent: #00ffc3;
      --text: #f6fcff;
      --muted: rgba(246, 252, 255, 0.72);
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 18px 48px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(2px);
    }

    h1, h2 {
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
    }

    .present {
      color: var(--accent);
      font-weight: 700;
    }

    .absent {
      color: #ff6b6b;
      font-weight: 700;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    a:hover {
      color: #66ffd6;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1><i class="fas fa-user-check"></i> Attendance</h1>
      <p>Track attendance by class and day.</p>
      <a href="studient potal.html"><i class="fas fa-arrow-left"></i> Back to portal</a>
    </div>

    <div class="card">
      <h2>SS2A - Weekly Attendance</h2>
      <table>
        <thead>
          <tr><th>Student</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th></tr>
        </thead>
        <tbody>
          <tr><td>Ada Okafor</td><td class="present">P</td><td class="present">P</td><td class="present">P</td><td class="present">P</td><td class="present">P</td></tr>
          <tr><td>Samuel Bassey</td><td class="present">P</td><td class="absent">A</td><td class="present">P</td><td class="present">P</td><td class="present">P</td></tr>
          <tr><td>Grace Musa</td><td class="present">P</td><td class="present">P</td><td class="absent">A</td><td class="present">P</td><td class="present">P</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
