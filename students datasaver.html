<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registered Students</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#0a192f;
  color:white;
  padding:30px;
}

.container{
  max-width:1100px;
  margin:auto;
}

h1{
  text-align:center;
  margin-bottom:30px;
  color:#00ffc3;
}

.table-box{
  overflow-x:auto;
  background:#112240;
  border-radius:15px;
  border:1px solid #233554;
  padding:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:15px;
  text-align:left;
  border-bottom:1px solid #233554;
}

th{
  background:#0f2747;
  color:#00ffc3;
}

tr:hover{
  background:#1a2f52;
}

.loading{
  text-align:center;
  margin-top:20px;
  color:#00ffc3;
}

.no-data{
  text-align:center;
  padding:20px;
  color:#ccc;
}

</style>
</head>
<body>
<div style="margin-bottom:15px;">
  <input type="text" id="searchInput" placeholder="Search student name..."
    style="width:100%;padding:12px;border-radius:8px;border:none;outline:none;">
</div>
<div class="container">

<h1>Registered Students</h1>

<div class="table-box">

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Role</th>
<th>User ID</th>
</tr>
</thead>

<tbody id="studentTable">
<tr>
<td colspan="4" class="loading">Loading students...</td>
</tr>
</tbody>

</table>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDmvmqTgjhbtgLxrbvgmT3LQgEsNoj3x_g",
  authDomain: "positivechangecollege-4d2cb.firebaseapp.com",
  projectId: "positivechangecollege-4d2cb",
  storageBucket: "positivechangecollege-4d2cb.firebasestorage.app",
  messagingSenderId: "847572892577",
  appId: "1:847572892577:web:1f6184c056ca46cf3ce9e0",
  measurementId: "G-CVGTLPDR5M"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const table = document.getElementById("studentTable");
const searchInput = document.getElementById("searchInput");

let allStudents = []; // store students here

// LOAD STUDENTS ONCE
async function loadStudents() {

  try {

    const querySnapshot = await getDocs(collection(db, "students"));

    allStudents = [];

    querySnapshot.forEach((docSnap) => {
      allStudents.push({
        id: docSnap.id,
        ...docSnap.data()
      });
    });

    displayStudents(allStudents);

  } catch (error) {
    table.innerHTML = `
      <tr>
        <td colspan="6" class="no-data">${error.message}</td>
      </tr>
    `;
  }
}

// DISPLAY FUNCTION
function displayStudents(students) {

  if (students.length === 0) {
    table.innerHTML = `
      <tr>
        <td colspan="6" class="no-data">No students found</td>
      </tr>
    `;
    return;
  }

  table.innerHTML = "";

  students.forEach((student) => {

    table.innerHTML += `
      <tr>
        <td>${student.name || "No Name"}</td>
        <td>${student.email || "No Email"}</td>
        <td>${student.role || "student"}</td>
        <td>${student.class || "No Class"}</td>
        <td>${student.id}</td>

        <td>
          <button onclick="deleteStudent('${student.id}')">
            Delete
          </button>
        </td>
      </tr>
    `;
  });
}

// SEARCH FUNCTION
searchInput.addEventListener("input", function () {

  const value = this.value.toLowerCase();

  const filtered = allStudents.filter(student =>
    (student.name || "").toLowerCase().includes(value)
  );

  displayStudents(filtered);
});

// DELETE STUDENT
window.deleteStudent = async function (id) {

  const confirmDelete = confirm("Delete this student?");

  if (confirmDelete) {

    try {
      await deleteDoc(doc(db, "students", id));

      alert("Student deleted successfully");

      loadStudents(); // reload

    } catch (error) {
      alert(error.message);
    }
  }
};

// INIT
loadStudents();
</script>

</body>
</html>
