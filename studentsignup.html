<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Student Account</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
       background: radial-gradient(circle at 10% 20%, rgba(10, 25, 47, 0.98), rgba(2, 12, 27, 1));
    }

    .container{
      width:350px;
      background: rgba(0, 255, 195, 0.4);
      padding:30px;
      border-radius:15px;
      box-shadow:0 5px 20px rgba(0,0,0,0.3);
    }

    h1{
      text-align:center;
      color: #00ffc3;
      margin-bottom:25px;
    }

    .input-box{
      margin-bottom:18px;
    }

    .input-box label{
      display:block;
      color: #00ffc3;
      margin-bottom:6px;
      font-size:14px;
    }

    .input-box input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      outline:none;
      font-size:15px;
    }

    button{
      width:100%;
      padding:12px;
    background: rgba(0, 255, 195, 0.4);
      color: #00ffc3;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover{
      background: #00ffc3;
      color: #00214d;
    }


    .input-box{
  width:100%;
  padding:10px;
  border-radius:6px;
  border:none;
  outline:none;
  cursor:pointer;
}
    .message{
      margin-top:15px;
      text-align:center;
      color:white;
      font-size:14px;
    }

    a{
      color:#38bdf8;
      text-decoration:none;
    }

    .bottom-text{
      text-align:center;
      margin-top:15px;
      color:white;
      font-size:14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Create  Student Account</h1>

    <form id="signupForm">

      <div class="input-box">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter full name" required>
      </div>

      <div class="input-box">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email" required>
      </div>

      <select class="input-box" id="studentClass" required>
  <option value="">Select Class</option>
  <option value="JSS1">JSS1</option>
  <option value="JSS2">JSS2</option>
  <option value="JSS3">JSS3</option>
  <option value="SS1">SS1</option>
  <option value="SS2">SS2</option>
  <option value="SS3">SS3</option>
</select>

      <div class="input-box">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit">Create Account</button>

      <div class="message" id="message"></div>

    </form>

    <div class="bottom-text">
      Already have an account?
      <a href="student potal signin.html">Sign In</a>
    </div>

  </div>


<script type="module">

// Firebase Imports
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDmvmqTgjhbtgLxrbvgmT3LQgEsNoj3x_g",
  authDomain: "positivechangecollege-4d2cb.firebaseapp.com",
  projectId: "positivechangecollege-4d2cb",
  storageBucket: "positivechangecollege-4d2cb.firebasestorage.app",
  messagingSenderId: "847572892577",
  appId: "1:847572892577:web:1f6184c056ca46cf3ce9e0",
  measurementId: "G-CVGTLPDR5M"
};

// Init Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Form
const form = document.getElementById("signupForm");
const message = document.getElementById("message");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const studentClass = document.getElementById("studentClass").value.trim();

  if (!studentClass) {
    message.innerText = "Please enter a class (e.g SS2)";
    return;
  }

  try {
    // Create Auth user
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    // Save to Firestore
    await setDoc(doc(db, "students", user.uid), {
      name,
      email,
      class: studentClass,
      uid: user.uid,
      createdAt: serverTimestamp()
    });

    message.innerText = "Account created successfully 🎉";

    setTimeout(() => {
      window.location.href = "student potal signin.html";
    }, 1500);

  } catch (error) {
    console.error(error);
    message.innerText = error.message;
  }
});
</script>

</body>
</html>
