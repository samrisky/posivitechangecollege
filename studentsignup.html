<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Sign Up – Positive Change College</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at 10% 20%, rgba(10, 25, 47, 0.98), rgba(2, 12, 27, 1));
            background-attachment: fixed;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            padding: 44px 40px 40px;
            border-radius: 32px;
            border: 1px solid rgba(0, 255, 195, 0.12);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: border-color 0.3s;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .container:hover {
            border-color: rgba(0, 255, 195, 0.25);
        }
        .container::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -30%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 255, 195, 0.04), transparent 70%);
            pointer-events: none;
            z-index: -1;
            border-radius: 32px;
        }

        /* ── Logo – improved ── */
        .logo-wrapper {
            margin-bottom: 12px;
        }
        .logo-wrapper img {
            width: 80px;
            height: auto;
            display: block;
            margin: 0 auto 8px;
            border: 2px solid rgba(0, 255, 195, 0.25);
            border-radius: 16px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.2);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .logo-wrapper img:hover {
            border-color: #00ffc3;
            box-shadow: 0 0 20px rgba(0, 255, 195, 0.15);
        }

        .container h1 {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .container h1 span {
            color: #00ffc3;
        }
        .container .subtitle {
            color: rgba(255, 255, 255, 0.45);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-box {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
        }
        .input-box input,
        .input-box select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            outline: none;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
            appearance: none;
            cursor: pointer;
        }
        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        .input-box input:focus,
        .input-box select:focus {
            border-color: #00ffc3;
            background: rgba(0, 255, 195, 0.04);
            box-shadow: 0 0 0 4px rgba(0, 255, 195, 0.08);
        }
        .input-box select option {
            background: #0b1a2e;
            color: #fff;
        }
        .input-box.select-wrapper {
            position: relative;
        }
        .input-box.select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: #00ffc3;
            color: #0b1a2e;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.25s;
            letter-spacing: 0.2px;
        }
        .btn-primary:hover {
            background: #66ffd6;
            transform: scale(1.01);
            box-shadow: 0 8px 30px rgba(0, 255, 195, 0.25);
        }

        .message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            min-height: 22px;
            color: #ffc857;
        }
        .message.success {
            color: #00ffc3;
        }
        .message.error {
            color: #ff6b6b;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }
        .bottom-text a {
            color: #00ffc3;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
            border-bottom: 1px solid transparent;
        }
        .bottom-text a:hover {
            color: #66ffd6;
            border-bottom-color: rgba(0, 255, 195, 0.3);
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 22px 30px;
            }
            .container h1 {
                font-size: 22px;
            }
            .logo-wrapper img {
                width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ─── LOGO ─── -->
        <div class="logo-wrapper">
            <img src="./pictures/pca logo.png" alt="Positive Change College Logo" />
        </div>

        <h1>Positive Change <span>College</span></h1>
        <p class="subtitle">Create your Student Account</p>

        <form id="signupForm">
            <div class="input-box">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter full name" required />
            </div>
            <div class="input-box">
                <label>Email</label>
                <input type="email" id="email" placeholder="student@positive.edu" required />
            </div>
            <div class="input-box select-wrapper">
                <label>Class</label>
                <select id="studentClass" required>
                    <option value="">Select Class</option>
                    <option value="JSS1">JSS1</option>
                    <option value="JSS2">JSS2</option>
                    <option value="JSS3">JSS3</option>
                    <option value="SS1">SS1</option>
                    <option value="SS2">SS2</option>
                    <option value="SS3">SS3</option>
                </select>
            </div>
            <div class="input-box">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password" required />
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
            <div class="message" id="message"></div>
        </form>

        <div class="bottom-text">
            Already have an account? <a href="student-signin.html">Sign In</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmvmqTgjhbtgLxrbvgmT3LQgEsNoj3x_g",
            authDomain: "positivechangecollege-4d2cb.firebaseapp.com",
            projectId: "positivechangecollege-4d2cb",
            storageBucket: "positivechangecollege-4d2cb.firebasestorage.app",
            messagingSenderId: "847572892577",
            appId: "1:847572892577:web:1f6184c056ca46cf3ce9e0",
            measurementId: "G-CVGTLPDR5M"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById("signupForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const studentClass = document.getElementById("studentClass").value.trim();

            message.textContent = '';
            message.className = 'message';

            if (!studentClass) {
                message.textContent = 'Please select your class.';
                message.className = 'message error';
                return;
            }
            if (password.length < 6) {
                message.textContent = 'Password must be at least 6 characters.';
                message.className = 'message error';
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await setDoc(doc(db, "students", user.uid), {
                    name,
                    email,
                    class: studentClass,
                    uid: user.uid,
                    approved: false,
                    suspended: false,
                    createdAt: serverTimestamp()
                });

                message.textContent = 'Account created! Awaiting admin approval.';
                message.className = 'message success';

                setTimeout(() => {
                    window.location.href = "student-waiting.html";
                }, 2000);

            } catch (error) {
                console.error(error);
                let msg = error.message;
                if (error.code === 'auth/email-already-in-use') msg = 'This email is already registered.';
                else if (error.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
                else if (error.code === 'auth/weak-password') msg = 'Password is too weak. Use at least 6 characters.';
                message.textContent = msg;
                message.className = 'message error';
            }
        });
    </script>
</body>
</html>
