<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Tracker - CBT Portal</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Firebase SDK -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js"
            }
        }
    </script>

    <style>
        /* ─────────── RESET & BASE ─────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 20%, rgba(10, 25, 47, 0.98), rgba(2, 12, 27, 1));
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: white;
        }

        /* ─────────── HEADER ─────────── */
        .header-bar {
            background: #00ffc3;
            color: rgba(2, 12, 27, 0.98);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .header-bar .title {
            display: flex;
            align-items: center;
            gap: 16px;
            font-weight: 600;
        }

        .header-bar .title i {
            font-size: 28px;
        }

        .header-bar .title h1 {
            font-size: 24px;
            margin: 0;
        }

        .header-bar .actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .header-bar button {
            background: rgba(2, 12, 27, 0.2);
            border: none;
            color: rgba(2, 12, 27, 0.98);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-bar button:hover {
            background: rgba(2, 12, 27, 0.3);
        }

        /* ─────────── MAIN CONTENT ─────────── */
        .main-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ─────────── STATS ─────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(0, 255, 195, 0.1);
            border: 1px solid #00ffc3;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 40px;
            font-weight: 700;
            color: #00ffc3;
            margin-bottom: 8px;
        }

        .stat-card .label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ─────────── FILTERS ─────────── */
        .filters-section {
            background: rgba(0, 255, 195, 0.05);
            border: 1px solid rgba(0, 255, 195, 0.2);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filters-section label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .filters-section input,
        .filters-section select {
            padding: 10px 14px;
            border: 1px solid rgba(0, 255, 195, 0.3);
            border-radius: 8px;
            background: rgba(0, 255, 195, 0.05);
            color: white;
            font-size: 14px;
        }

        .filters-section input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* ─────────── TABLE ─────────── */
        .table-wrapper {
            background: rgba(0, 255, 195, 0.05);
            border: 1px solid rgba(0, 255, 195, 0.2);
            border-radius: 16px;
            overflow: hidden;
        }

        .students-table {
            width: 100%;
            border-collapse: collapse;
        }

        .students-table thead {
            background: rgba(0, 255, 195, 0.1);
            border-bottom: 2px solid #00ffc3;
        }

        .students-table thead th {
            padding: 16px 20px;
            text-align: left;
            font-weight: 600;
            color: #00ffc3;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .students-table tbody tr {
            border-bottom: 1px solid rgba(0, 255, 195, 0.1);
            transition: background 0.2s;
        }

        .students-table tbody tr:hover {
            background: rgba(0, 255, 195, 0.08);
        }

        .students-table tbody td {
            padding: 16px 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .students-table .student-name {
            font-weight: 600;
            color: #00ffc3;
        }

        .students-table .class-badge {
            display: inline-block;
            background: rgba(0, 255, 195, 0.2);
            color: #00ffc3;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .students-table .program-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .students-table .program-badge.science {
            background: rgba(100, 200, 255, 0.2);
            color: #64c8ff;
        }

        .students-table .program-badge.arts {
            background: rgba(255, 180, 100, 0.2);
            color: #ffb464;
        }

        .students-table .program-badge.commercial {
            background: rgba(150, 180, 255, 0.2);
            color: #96b4ff;
        }

        .students-table .action-btn {
            background: none;
            border: none;
            color: #00ffc3;
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            transition: 0.2s;
        }

        .students-table .action-btn:hover {
            color: #00ffe0;
            transform: scale(1.15);
        }

        /* ─────────── EMPTY STATE ─────────── */
        .empty-state {
            text-align: center;
            padding: 60px 40px;
        }

        .empty-state i {
            font-size: 64px;
            color: rgba(0, 255, 195, 0.3);
            margin-bottom: 20px;
            display: block;
        }

        .empty-state p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* ─────────── MODAL ─────────── */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(2, 12, 27, 0.95);
            border: 1px solid rgba(0, 255, 195, 0.2);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #00ffc3;
            margin-bottom: 24px;
        }

        .modal-content .detail-item {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 255, 195, 0.1);
        }

        .modal-content .detail-item strong {
            color: rgba(255, 255, 255, 0.7);
            min-width: 150px;
        }

        .modal-content .detail-item span {
            color: white;
            text-align: right;
            flex: 1;
        }

        .modal-content .close-btn {
            background: rgba(0, 255, 195, 0.1);
            border: 1px solid #00ffc3;
            color: #00ffc3;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 24px;
        }

        .modal-content .close-btn:hover {
            background: rgba(0, 255, 195, 0.2);
        }

        /* ─────────── LOADING ─────────── */
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.7);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 195, 0.2);
            border-top: 3px solid #00ffc3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ─────────── RESPONSIVE ─────────── */
        @media (max-width: 768px) {
            .header-bar {
                padding: 16px 20px;
                flex-direction: column;
                gap: 16px;
            }

            .header-bar .title h1 {
                font-size: 20px;
            }

            .main-container {
                padding: 20px;
            }

            .filters-section {
                flex-direction: column;
            }

            .students-table {
                font-size: 12px;
            }

            .students-table th,
            .students-table td {
                padding: 12px 10px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .header-bar .title {
                flex-direction: column;
                gap: 8px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── HEADER ─── -->
    <div class="header-bar">
        <div class="title">
            <i class="fas fa-clipboard-list"></i>
            <h1>Student Registration Tracker</h1>
        </div>
        <div class="actions">
            <button onclick="goBack()">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <button onclick="exportData()">
                <i class="fas fa-download"></i> Export
            </button>
        </div>
    </div>

    <!-- ─── MAIN CONTENT ─── -->
    <div class="main-container">
        <div class="container">

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">Total Registrations</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="maleCount">0</div>
                    <div class="label">Male Students</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="femaleCount">0</div>
                    <div class="label">Female Students</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="classCount">0</div>
                    <div class="label">Classes Represented</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters-section">
                <label for="searchInput">
                    <i class="fas fa-search"></i> Search:
                </label>
                <input type="text" id="searchInput" placeholder="Name, email, or class..." onkeyup="filterTable()">

                <label for="classFilter">
                    <i class="fas fa-book"></i> Class:
                </label>
                <select id="classFilter" onchange="filterTable()">
                    <option value="">All Classes</option>
                    <option value="JSS 1">JSS 1</option>
                    <option value="JSS 2">JSS 2</option>
                    <option value="JSS 3">JSS 3</option>
                    <option value="SS 1">SS 1</option>
                    <option value="SS 2">SS 2</option>
                    <option value="SS 3">SS 3</option>
                </select>

                <label for="programFilter">
                    <i class="fas fa-flask"></i> Program:
                </label>
                <select id="programFilter" onchange="filterTable()">
                    <option value="">All Programs</option>
                    <option value="Science">Science</option>
                    <option value="Arts">Arts</option>
                    <option value="Commercial">Commercial</option>
                </select>
            </div>

            <!-- Table -->
            <div class="table-wrapper">
                <div id="loadingState" class="loading">
                    <div class="spinner"></div>
                    <p>Loading registrations...</p>
                </div>

                <div id="tableContent" style="display: none;">
                    <table class="students-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Full Name</th>
                                <th>Class</th>
                                <th>Program</th>
                                <th>Gender</th>
                                <th>Guardian Email</th>
                                <th>Date Registered</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentsTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>

                <div id="emptyState" style="display: none;" class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>No student registrations found.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- ─── DETAILS MODAL ─── -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <h2 id="modalTitle">Student Details</h2>
            <div id="modalBody"></div>
            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <!-- ─── JAVASCRIPT ─── -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmvmqTgjhbtgLxrbvgmT3LQgEsNoj3x_g",
            authDomain: "positivechangecollege-4d2cb.firebaseapp.com",
            projectId: "positivechangecollege-4d2cb",
            storageBucket: "positivechangecollege-4d2cb.firebasestorage.app",
            messagingSenderId: "847572892577",
            appId: "1:847572892577:web:1f6184c056ca46cf3ce9e0",
            measurementId: "G-CVGTLPDR5M"
        };

        let allStudents = [];
        let filteredStudents = [];

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadStudents() {
            try {
                // First try Firebase
                const querySnapshot = await getDocs(collection(db, 'school-admissions'));
                allStudents = [];
                querySnapshot.forEach((doc) => {
                    allStudents.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                // Also load from localStorage for offline data
                const stored = localStorage.getItem('schoolFormRegistrations');
                if (stored) {
                    const localData = JSON.parse(stored);
                    // Merge, avoiding duplicates
                    localData.forEach(item => {
                        if (!allStudents.find(s => s.fullName === item.fullName && s.createdAt === item.createdAt)) {
                            allStudents.unshift(item);
                        }
                    });
                }

                // Sort by date (newest first)
                allStudents.sort((a, b) => {
                    const dateA = new Date(a.createdAt || 0);
                    const dateB = new Date(b.createdAt || 0);
                    return dateB - dateA;
                });

                filteredStudents = [...allStudents];
                updateStats();
                displayStudents();
            } catch (error) {
                console.error('Error loading students:', error);
                alert('Error loading student data. Showing cached data.');
                
                // Fallback to localStorage
                const stored = localStorage.getItem('schoolFormRegistrations');
                if (stored) {
                    allStudents = JSON.parse(stored);
                    filteredStudents = [...allStudents];
                    updateStats();
                    displayStudents();
                }
            }
        }

        function updateStats() {
            let maleCount = 0, femaleCount = 0, classes = new Set();

            allStudents.forEach(student => {
                if (student.gender === 'Male') maleCount++;
                if (student.gender === 'Female') femaleCount++;
                if (student.studentClass) classes.add(student.studentClass);
            });

            document.getElementById('totalCount').textContent = allStudents.length;
            document.getElementById('maleCount').textContent = maleCount;
            document.getElementById('femaleCount').textContent = femaleCount;
            document.getElementById('classCount').textContent = classes.size;
        }

        function displayStudents() {
            const tbody = document.getElementById('studentsTableBody');
            const loadingState = document.getElementById('loadingState');
            const tableContent = document.getElementById('tableContent');
            const emptyState = document.getElementById('emptyState');

            loadingState.style.display = 'none';

            if (filteredStudents.length === 0) {
                tableContent.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            tableContent.style.display = 'block';
            emptyState.style.display = 'none';
            tbody.innerHTML = '';

            filteredStudents.forEach((student, index) => {
                const row = tbody.insertRow();
                const date = student.createdAt ? new Date(student.createdAt).toLocaleDateString() : 'N/A';
                const programClass = student.program ? student.program.toLowerCase() : '';

                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td class="student-name">${student.fullName || 'N/A'}</td>
                    <td><span class="class-badge">${student.studentClass || 'N/A'}</span></td>
                    <td><span class="program-badge ${programClass}">${student.program || 'N/A'}</span></td>
                    <td>${student.gender || 'N/A'}</td>
                    <td>${student.guardianEmail || student.studentEmail || 'N/A'}</td>
                    <td>${date}</td>
                    <td>
                        <button class="action-btn" title="View Details" onclick="viewDetails('${student.id}')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </td>
                `;
            });
        }

        window.filterTable = function() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const classFilter = document.getElementById('classFilter').value;
            const programFilter = document.getElementById('programFilter').value;

            filteredStudents = allStudents.filter(student => {
                const matchesSearch = !search || 
                    (student.fullName && student.fullName.toLowerCase().includes(search)) ||
                    (student.guardianEmail && student.guardianEmail.toLowerCase().includes(search)) ||
                    (student.studentClass && student.studentClass.toLowerCase().includes(search));

                const matchesClass = !classFilter || student.studentClass === classFilter;
                const matchesProgram = !programFilter || student.program === programFilter;

                return matchesSearch && matchesClass && matchesProgram;
            });

            displayStudents();
        };

        window.viewDetails = function(studentId) {
            const student = allStudents.find(s => s.id === studentId) || allStudents.find((s, i) => i.toString() === studentId);
            if (!student) return;

            let html = '';
            const fields = [
                ['Full Name', 'fullName'],
                ['Date of Birth', 'dateOfBirth'],
                ['Class', 'studentClass'],
                ['Program', 'program'],
                ['Gender', 'gender'],
                ['Nationality', 'nationality'],
                ['Religion', 'religion'],
                ['State', 'state'],
                ['LGA', 'lga'],
                ['Home Address', 'address'],
                ['Guardian Name', 'guardianName'],
                ['Guardian Email', 'guardianEmail'],
                ['Guardian Phone', 'guardianPhone'],
                ['Emergency Contact', 'emergencyName'],
                ['Registration Date', 'createdAt']
            ];

            fields.forEach(([label, key]) => {
                if (student[key]) {
                    let value = student[key];
                    if (key === 'createdAt') {
                        value = new Date(value).toLocaleString();
                    }
                    html += `<div class="detail-item"><strong>${label}</strong><span>${value}</span></div>`;
                }
            });

            document.getElementById('modalTitle').textContent = `${student.fullName || 'Student'} - Details`;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('detailsModal').classList.add('active');
        };

        window.closeModal = function() {
            document.getElementById('detailsModal').classList.remove('active');
        };

        window.exportData = function() {
            let csv = 'Full Name,Class,Program,Gender,Email,Phone,Date Registered\n';
            filteredStudents.forEach(student => {
                const date = student.createdAt ? new Date(student.createdAt).toLocaleDateString() : '';
                csv += `"${student.fullName || ''}","${student.studentClass || ''}","${student.program || ''}","${student.gender || ''}","${student.guardianEmail || student.studentEmail || ''}","${student.guardianPhone || ''}","${date}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `student-registrations-${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        };

        window.goBack = function() {
            window.location.href = 'cbt dashboard.html';
        };

        // Load students on page load
        window.addEventListener('DOMContentLoaded', loadStudents);
    </script>
</body>
</html>
